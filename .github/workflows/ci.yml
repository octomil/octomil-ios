name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  test:
    timeout-minutes: 25
    name: Test & Analysis
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Preflight — toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          swift package resolve

      - name: Build for testing
        run: |
          # macOS destination rather than iOS Simulator: GitHub-hosted runners ship
          # without any iOS Simulator runtime installed, so even 'Any iOS Simulator
          # Device' fails destination resolution (the placeholder is not a usable
          # runtime). This is a Swift Package with no UIKit entry points; the macOS
          # SDK exercises the same logic. iOS-specific paths are guarded by @available.
          #
          # build-for-testing rather than build: compiles once and produces a reusable
          # test bundle consumed by test-without-building below, avoiding a second full
          # compile pass. See OCT-99.
          xcodebuild -scheme Octomil \
            -destination 'platform=macOS,arch=arm64' \
            build-for-testing

      - name: Run tests with coverage
        run: |
          xcodebuild -scheme Octomil \
            -destination 'platform=macOS,arch=arm64' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults \
            test-without-building

      - name: Generate coverage report
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          xcrun xccov view --report TestResults.xcresult

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          file: ./coverage.json
          flags: swift
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Convert coverage to SonarCloud generic format
        run: |
          python3 << 'PYEOF'
          import json, subprocess, xml.etree.ElementTree as ET

          result = subprocess.run(
              ["xcrun", "xccov", "view", "--report", "--json", "TestResults.xcresult"],
              capture_output=True, text=True, check=True,
          )
          report = json.loads(result.stdout)

          root = ET.Element("coverage", version="1")
          for target in report.get("targets", []):
              for src in target.get("files", []):
                  path = src.get("path", "")
                  if not path or "/Tests/" in path:
                      continue
                  file_el = ET.SubElement(root, "file", path=path)
                  lines_out = subprocess.run(
                      ["xcrun", "xccov", "view", "--file", path, "TestResults.xcresult"],
                      capture_output=True, text=True,
                  )
                  for num, raw_line in enumerate(lines_out.stdout.splitlines(), 1):
                      col = raw_line.split(":")[0].strip() if ":" in raw_line else ""
                      if col and col != "*":
                          try:
                              hits = int(col)
                              ET.SubElement(file_el, "lineToCover",
                                  lineNumber=str(num), covered=("true" if hits > 0 else "false"))
                          except ValueError:
                              pass

          tree = ET.ElementTree(root)
          ET.indent(tree)
          tree.write("sonar-coverage.xml", xml_declaration=True, encoding="UTF-8")
          print("Generated sonar-coverage.xml")
          PYEOF

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  swiftlint:
    timeout-minutes: 10
    name: SwiftLint
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter json > swiftlint-report.json || true

      - name: Upload lint report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: swiftlint-report
          path: swiftlint-report.json

  ios-build:
    timeout-minutes: 25
    name: iOS Build (xcodebuild)
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Preflight — toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # Build the full OctomilClient product for iOS Simulator. This compiles
      # the iOS-only adapter targets (OctomilRuntimeSherpa, OctomilRuntimeSherpaTTS,
      # OctomilRuntimeWhisper, OctomilRuntimeLlama) which are gated
      # `.when(platforms: [.iOS])` in Package.swift and are silently SKIPPED
      # by `swift build` on macOS.
      #
      # Without this step the SDK can ship Swift-↔-C-API drift in the
      # adapters (struct field rename, nullable change, protocol type
      # rename) that breaks every iOS consumer at xcodebuild time but
      # passes the macOS-only CI clean. See:
      # https://github.com/octomil/octomil-workspace/pull/66 for the
      # post-mortem on the two bugs this catches.
      #
      # `generic/platform=iOS Simulator` is a destination placeholder
      # that requires only the SDK headers (pre-installed on macos-15
      # runners), not a running simulator. Compile-only — no tests.
      - name: Build OctomilClient for iOS Simulator
        run: |
          xcodebuild -scheme OctomilClient \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

  ci-complete:
    timeout-minutes: 5
    name: CI Complete
    runs-on: macos-14
    needs:
      - test
      - swiftlint
      - ios-build
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify CI jobs succeeded
        run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "Needed job results: ${results}"
          if echo "${results}" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::One or more CI jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "CI complete."
