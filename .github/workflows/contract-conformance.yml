name: Contract Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: ios conformance
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install codegen dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Fetch contract bundle
        id: contract
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import pathlib

          manifest = json.loads(pathlib.Path("contract-manifest.json").read_text())
          print(manifest["contractVersion"])
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          mkdir -p .contract "$RUNNER_TEMP/contract-bundle"
          if gh release download "v${version}" \
            --repo octomil/octomil-contracts \
            --pattern "contract-bundle-${version}.tar.gz" \
            --dir "$RUNNER_TEMP/contract-bundle"; then
            tar -xzf "$RUNNER_TEMP/contract-bundle/contract-bundle-${version}.tar.gz" \
              --strip-components=1 \
              -C .contract
            echo "source=bundle" >> "$GITHUB_OUTPUT"
          elif [ "$version" = "1.29.0" ]; then
            # v1.29.0 was released before octomil-contracts#211 started
            # publishing contract-bundle assets. Keep this one pinned
            # fallback so the transition PR can pass; future versions must
            # publish a bundle or this gate should fail.
            echo "::warning::contract-bundle-${version}.tar.gz predates bundle publishing; falling back to pinned source checkout."
            echo "source=source" >> "$GITHUB_OUTPUT"
          else
            echo "::error::contract-bundle-${version}.tar.gz is not published or cannot be downloaded."
            echo "::error::Expected octomil-contracts release v${version} to include the SDK contract bundle."
            exit 1
          fi

      - name: Fetch pre-bundle contracts source fallback
        if: steps.contract.outputs.source != 'bundle'
        uses: actions/checkout@v4
        with:
          repository: octomil/octomil-contracts
          ref: v${{ steps.contract.outputs.version }}
          path: .contract
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Validate contract root
        env:
          EXPECTED_CONTRACT_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          import yaml

          root = pathlib.Path(".contract")
          version = yaml.safe_load((root / "contract.yaml").read_text())["version"]
          expected = os.environ["EXPECTED_CONTRACT_VERSION"]
          if version != expected:
              print(f"::error::.contract version {version} != expected {expected}")
              sys.exit(1)
          for required in [
              "conformance",
              "generated/swift",
              "scripts/generate_conformance.py",
              "scripts/sync_generated.py",
              "ci/audit-sdks.py",
              "ci/client_sdk_surface.yaml",
          ]:
              if not (root / required).exists():
                  print(f"::error::.contract is missing {required}")
                  sys.exit(1)
          print(f"Contract root ready from ${{ steps.contract.outputs.source }}: v{version}")
          PY

      - name: Check generated contracts
        run: python3 .contract/scripts/sync_generated.py --sdk ios --check --target-dir Sources/Octomil/Generated

      - name: Run conformance tests
        env:
          CONTRACT_ROOT: ${{ github.workspace }}/.contract
          CONTRACT_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          xcodebuild -scheme Octomil -destination 'platform=macOS,arch=arm64' -only-testing:OctomilTests/ContractConformanceTests test
          python3 .contract/ci/audit-sdks.py --sdk ios --sdk-path . --out parity_report.json

      - name: Gate parity score
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path("parity_report.json")
          if not report_path.exists():
              print("::error::No parity report generated.")
              sys.exit(1)
          score = json.loads(report_path.read_text()).get("summary", {}).get("parityScore", 0)
          print(f"Parity score: {score}% (floor: 60%)")
          if float(score) < 60:
              print(f"::error::Parity score {score}% is below floor 60%")
              sys.exit(1)
          PY

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-ios-${{ steps.contract.outputs.version }}
          path: parity_report.json
          retention-days: 90

  conformance-complete:
    name: Contract Conformance Complete
    runs-on: macos-15
    timeout-minutes: 5
    needs:
      - conformance
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify conformance succeeded
        run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "Needed job results: ${results}"
          if echo "${results}" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::Contract conformance failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "Contract conformance complete."
