name: OpenAPI Spec Fresh

# Verifies the vendored contract spec copy at Sources/Octomil/openapi.yaml is
# in sync with octomil-contracts/dist/openapi.yaml, and — when octomil-server
# has published a snapshot — that every documented method has a real server
# route (strict spec->server coverage).
#
# SCOPE NOTE (why this gate does NOT run swift-openapi-generator):
#   iOS does not currently consume swift-openapi generated client/types.
#   - Sources/Octomil/{Client,Types}.swift are HAND-MAINTAINED compatibility
#     shims (they hold custom types such as _OctomilAPIErrorPayload that the
#     facade depends on and that the generator does not emit).
#   - Sources/Octomil/Generated/ holds contract DOMAIN ENUMS vendored from
#     octomil-contracts (codegen/generate.py --lang swift), which are drift-
#     gated by the contracts repo's own `codegen/generate.py --check`.
#   So the one contract-derived artifact this SDK owns directly is the
#   openapi.yaml spec copy — that is what this gate checks. Adopting the real
#   1.12.2 swift-openapi client is a separate migration (facade rework), not a
#   freshness check.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  openapi-spec-fresh:
    name: openapi.yaml spec copy matches contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout octomil-ios
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout octomil-contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout/
          # Cross-repo checkout of a private repo — github.token cannot
          # read it. CROSS_REPO_READ_TOKEN must be a PAT with
          # `contents: read` on octomil/octomil-contracts.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build contract spec + refresh the vendored copy
        run: |
          pip install pyyaml jsonschema --quiet
          ( cd .contracts-checkout && make --silent spec-build )
          cp .contracts-checkout/dist/openapi.yaml Sources/Octomil/openapi.yaml

      - name: Fail on stale spec copy
        run: |
          git diff --exit-code -- Sources/Octomil/openapi.yaml || {
            echo "::error::Sources/Octomil/openapi.yaml is stale vs octomil-contracts."
            echo "Run 'make openapi-generate' (or copy contracts dist/openapi.yaml) and commit."
            exit 1
          }
          echo "✓ Sources/Octomil/openapi.yaml matches the contract"

      - name: Fetch latest server openapi snapshot
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          SHA=$(gh run list --repo octomil/octomil-server --workflow ci.yml \
                --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          mkdir -p .snapshot
          if gh run download --repo octomil/octomil-server --name "openapi-snapshot-${SHA}" --dir .snapshot 2>/dev/null; then
            echo "Fetched snapshot for SHA $SHA"
            ls -la .snapshot/
          else
            echo "::warning::No openapi-snapshot artifact for $SHA — skipping strict check"
            echo "SKIP_STRICT=1" >> $GITHUB_ENV
          fi

      - name: Strict spec->server gate (documented methods have a real server route)
        if: env.SKIP_STRICT != '1'
        run: |
          cd .contracts-checkout
          python3 scripts/spec_coverage.py --strict --openapi-file "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json" || {
            echo "::error::Contract has documented-but-not-in-server methods."
            echo "Wait for octomil-server to ship matching endpoints, OR mark stray methods transport: local in contracts."
            exit 1
          }
