name: OpenAPI Types Fresh

# Verifies the generated OpenAPI artifacts under Sources/Octomil/Generated/
# (the path the swift-openapi-generator plugin writes to) and the spec copy
# at Sources/Octomil/openapi.yaml are in sync with octomil-contracts.
# Fails if a diff is detected after regeneration.
#
# Runs on every PR. Path filters previously let upstream-only drift
# (contracts SHA bump, auto-refresh PRs) land without firing the gate,
# and the stale list pointed at hand-written stubs (Types.swift /
# Client.swift) rather than the generator's actual output directory.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  openapi-fresh:
    name: OpenAPI generated types freshness
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout octomil-ios
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout octomil-contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve packages
        run: swift package resolve

      - name: Regenerate OpenAPI types
        env:
          OCTOMIL_IOS_PATH: ${{ github.workspace }}
          OCTOMIL_IOS: "1"
        run: |
          .contracts-checkout/tools/sdkgen/generate-swift.sh

      - name: Fail on stale generated files
        run: |
          # generate-swift.sh writes generated Swift to Sources/Octomil/Generated/
          # and copies the spec to Sources/Octomil/openapi.yaml. Diff both —
          # the previous list pointed at hand-written stubs the generator
          # never touches, so drift was invisible.
          git diff --exit-code -- Sources/Octomil/Generated/ Sources/Octomil/openapi.yaml \
            || { echo "::error::Generated OpenAPI files are stale. Run 'make openapi-generate' locally and commit."; exit 1; }

      - name: Verify AUTOGENERATED banner
        run: ./scripts/check_openapi_banner.sh
