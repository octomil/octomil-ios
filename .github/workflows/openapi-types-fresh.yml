name: OpenAPI Types Fresh

# Verifies that generated OpenAPI types in Sources/Octomil/Types.swift and
# Sources/Octomil/Client.swift are up-to-date with the current octomil-contracts
# openapi.yaml. Fails if a diff is detected after regeneration.
#
# Mirrors the Node pilot pattern (octomil-node PRs #94 + #95).
# Uses macos-14 (Xcode 15 / Swift 5.10) because swift-openapi-generator 1.6.0
# does not compile under Swift 6.2+ (MemberImportVisibility). macos-14 ships
# Swift 5.10 which is fully compatible.

on:
  push:
    branches: [main, develop]
    paths:
      - 'Sources/Octomil/openapi.yaml'
      - 'Sources/Octomil/openapi-generator-config.yaml'
      - 'Sources/Octomil/Types.swift'
      - 'Sources/Octomil/Client.swift'
      - '.github/workflows/openapi-types-fresh.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Sources/Octomil/openapi.yaml'
      - 'Sources/Octomil/openapi-generator-config.yaml'
      - 'Sources/Octomil/Types.swift'
      - 'Sources/Octomil/Client.swift'
      - 'Sources/Octomil/Client/OctomilError.swift'
      - '.github/workflows/openapi-types-fresh.yml'

permissions: {}

jobs:
  openapi-fresh:
    name: OpenAPI generated types freshness
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout octomil-ios
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout octomil-contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve packages
        run: swift package resolve

      - name: Regenerate OpenAPI types
        env:
          OCTOMIL_IOS_PATH: ${{ github.workspace }}
          OCTOMIL_IOS: "1"
        run: |
          .contracts-checkout/tools/sdkgen/generate-swift.sh

      - name: Fail on stale generated files
        run: |
          git diff --exit-code Sources/Octomil/Types.swift Sources/Octomil/Client.swift \
            || { echo "::error::Generated OpenAPI files are stale. Run 'make openapi-generate' locally and commit."; exit 1; }

      - name: Verify AUTOGENERATED banner
        run: ./scripts/check_openapi_banner.sh

      - name: Fetch latest server openapi snapshot
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          SHA=$(gh run list --repo octomil/octomil-server --workflow ci.yml \
                --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          mkdir -p .snapshot
          if gh run download --repo octomil/octomil-server --name "openapi-snapshot-${SHA}" --dir .snapshot 2>/dev/null; then
            echo "Fetched snapshot for SHA $SHA"
            ls -la .snapshot/
          else
            echo "::warning::No openapi-snapshot artifact for $SHA — skipping strict check"
            echo "SKIP_STRICT=1" >> $GITHUB_ENV
          fi

      - name: Strict spec->server gate (this SDK's contracts SHA has a real server route)
        if: env.SKIP_STRICT != '1'
        run: |
          # Verify every contract method this SDK was generated against
          # has a real server route. Without this, the SDK could ship
          # clients for spec-only endpoints that 404 at runtime.
          cd .contracts-checkout
          python3 scripts/spec_coverage.py --strict --openapi-file "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json" || {
            echo "::error::SDK was generated against a contracts SHA with documented-but-not-in-server methods."
            echo "Wait for octomil-server to ship matching endpoints, OR mark stray methods transport: local in contracts."
            exit 1
          }
