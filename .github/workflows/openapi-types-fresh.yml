name: OpenAPI Fresh

# Three gates:
#   1. (ubuntu) The vendored contract spec copy at Sources/Octomil/openapi.yaml
#      is in sync with octomil-contracts/dist/openapi.yaml.
#   2. (ubuntu) When octomil-server has published a snapshot, every documented
#      method has a real server route (strict spec->server coverage).
#   3. (macOS) The committed swift-openapi-generator client+types under
#      Sources/Octomil/GeneratedSources/ are fresh: regenerate from the contract
#      spec, diff the output, verify the AUTOGENERATED banner, and confirm the
#      generated client compiles into the Octomil target.
#
# SCOPE NOTE:
#   - Sources/Octomil/GeneratedSources/ = swift-openapi-generator output
#     (Client.swift + Types.swift), gated here by regenerate-and-diff (gate 3).
#   - Sources/Octomil/Generated/ = a DIFFERENT directory holding contract DOMAIN
#     ENUMS vendored from octomil-contracts (codegen/generate.py --lang swift),
#     drift-gated by the contracts repo's own `codegen/generate.py --check`. It
#     is NOT swift-openapi output and is deliberately not touched here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  openapi-spec-fresh:
    name: openapi.yaml spec copy matches contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout octomil-ios
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout octomil-contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout/
          # Cross-repo checkout of a private repo — github.token cannot
          # read it. CROSS_REPO_READ_TOKEN must be a PAT with
          # `contents: read` on octomil/octomil-contracts.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build contract spec + refresh the vendored copy
        run: |
          pip install pyyaml jsonschema --quiet
          ( cd .contracts-checkout && make --silent spec-build )
          cp .contracts-checkout/dist/openapi.yaml Sources/Octomil/openapi.yaml

      - name: Fail on stale spec copy
        run: |
          git diff --exit-code -- Sources/Octomil/openapi.yaml || {
            echo "::error::Sources/Octomil/openapi.yaml is stale vs octomil-contracts."
            echo "Run 'make openapi-generate' (or copy contracts dist/openapi.yaml) and commit."
            exit 1
          }
          echo "✓ Sources/Octomil/openapi.yaml matches the contract"

      - name: Fetch latest server openapi snapshot
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          SHA=$(gh run list --repo octomil/octomil-server --workflow ci.yml \
                --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          mkdir -p .snapshot
          if gh run download --repo octomil/octomil-server --name "openapi-snapshot-${SHA}" --dir .snapshot 2>/dev/null; then
            echo "Fetched snapshot for SHA $SHA"
            ls -la .snapshot/
          else
            echo "::warning::No openapi-snapshot artifact for $SHA — skipping strict check"
            echo "SKIP_STRICT=1" >> $GITHUB_ENV
          fi

      - name: Strict spec->server gate (documented methods have a real server route)
        if: env.SKIP_STRICT != '1'
        run: |
          cd .contracts-checkout
          python3 scripts/spec_coverage.py --strict --openapi-file "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json" || {
            echo "::error::Contract has documented-but-not-in-server methods."
            echo "Wait for octomil-server to ship matching endpoints, OR mark stray methods transport: local in contracts."
            exit 1
          }

  generated-client-fresh:
    name: GeneratedSources/ matches the contract (regenerate-and-diff)
    # macos-15: its Xcode/Swift toolchain matches the mlx-swift deps the Octomil
    # package graph resolves (macos-14's older Swift can't resolve mlx-swift
    # 0.30.6+ — "incompatible tools version"). Mirrors ci.yml's build jobs.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout octomil-ios
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout octomil-contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout/
          # Cross-repo checkout of a private repo — github.token cannot read it.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python (for contract spec-build)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Regenerate the swift-openapi client + types
        env:
          # Point the contracts script at this checkout; build only the core
          # Octomil target (skip MLX/llama/whisper binary XCFramework downloads).
          OCTOMIL_IOS_PATH: ${{ github.workspace }}
          OCTOMIL_IOS: "1"
          OCTOMIL_IOS_BUILD_TARGET: "Octomil"
        run: |
          pip install pyyaml jsonschema --quiet
          bash .contracts-checkout/tools/sdkgen/generate-swift.sh

      - name: Fail on stale generated client / spec copy
        run: |
          git diff --exit-code -- Sources/Octomil/GeneratedSources Sources/Octomil/openapi.yaml || {
            echo "::error::Sources/Octomil/GeneratedSources/ (or openapi.yaml) is stale vs the contract."
            echo "Run octomil-contracts/tools/sdkgen/generate-swift.sh and commit the result."
            exit 1
          }
          echo "✓ Generated client + spec copy match the contract"

      - name: Verify AUTOGENERATED banner
        run: bash scripts/check_openapi_banner.sh
