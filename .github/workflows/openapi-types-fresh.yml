name: OpenAPI Types Fresh

# Verifies the generated OpenAPI artifacts under Sources/Octomil/Generated/
# (the path the swift-openapi-generator plugin writes to) and the spec copy
# at Sources/Octomil/openapi.yaml are in sync with octomil-contracts.
# Fails if a diff is detected after regeneration.
#
# Runs on every PR. Path filters previously let upstream-only drift
# (contracts SHA bump, auto-refresh PRs) land without firing the gate,
# and the stale list pointed at hand-written stubs (Types.swift /
# Client.swift) rather than the generator's actual output directory.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  openapi-fresh:
    name: OpenAPI generated types freshness
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout octomil-ios
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout octomil-contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout/
          # Cross-repo checkout of a private repo — github.token cannot
          # read it. CROSS_REPO_READ_TOKEN must be a PAT with
          # `contents: read` on octomil/octomil-contracts.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Preflight — toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve packages
        run: swift package resolve

      - name: Regenerate OpenAPI types
        env:
          OCTOMIL_IOS_PATH: ${{ github.workspace }}
          OCTOMIL_IOS: "1"
        run: |
          .contracts-checkout/tools/sdkgen/generate-swift.sh

      - name: Fail on stale generated files
        run: |
          # generate-swift.sh writes generated Swift to Sources/Octomil/Generated/
          # and copies the spec to Sources/Octomil/openapi.yaml. Diff both —
          # the previous list pointed at hand-written stubs the generator
          # never touches, so drift was invisible.
          git diff --exit-code -- Sources/Octomil/Generated/ Sources/Octomil/openapi.yaml \
            || { echo "::error::Generated OpenAPI files are stale. Run 'make openapi-generate' locally and commit."; exit 1; }

      - name: Verify AUTOGENERATED banner
        run: ./scripts/check_openapi_banner.sh

      # Strict spec→server coverage gate. Mirrors #224's additions; kept
      # here so #226 doesn't regress the gate if it merges independently
      # of #224. Order: #224 lands first → conflict here is trivial;
      # #226 lands first → these steps survive on main.
      - name: Fetch latest server openapi snapshot
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          SHA=$(gh run list --repo octomil/octomil-server --workflow ci.yml \
                --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          mkdir -p .snapshot
          if gh run download --repo octomil/octomil-server --name "openapi-snapshot-${SHA}" --dir .snapshot 2>/dev/null; then
            echo "Fetched snapshot for SHA $SHA"
            ls -la .snapshot/
          else
            echo "::warning::No openapi-snapshot artifact for $SHA — skipping strict check"
            echo "SKIP_STRICT=1" >> $GITHUB_ENV
          fi

      - name: Strict spec->server gate (this SDK's contracts SHA has a real server route)
        if: env.SKIP_STRICT != '1'
        run: |
          # Verify every contract method this SDK was generated against
          # has a real server route. Without this, the SDK could ship
          # clients for spec-only endpoints that 404 at runtime.
          cd .contracts-checkout
          python3 scripts/spec_coverage.py --strict --openapi-file "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json" || {
            echo "::error::SDK was generated against a contracts SHA with documented-but-not-in-server methods."
            echo "Wait for octomil-server to ship matching endpoints, OR mark stray methods transport: local in contracts."
            exit 1
          }
